<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App Conteo Rutas</title>
    <link rel="manifest" href="manifest.json">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header>
            <div>
                <h1>Ruta Activa</h1>
                <span id="save-indicator" style="font-size: 0.8rem; color: #a9dfbf; opacity: 0; transition: opacity 0.5s;">Autoguardado ✓</span>
            </div>
            <div style="display: flex; gap: 8px;">
                <button id="btn-historial" class="btn-secondary" onclick="abrirHistorial()">Ver Historial</button>
                <button id="btn-nuevo-recorrido" class="btn-danger">Terminar Ruta</button>
            </div>
        </header>

        <!-- Modal de Historial -->
        <div id="modal-historial" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Historial de Rutas</h2>
                    <button class="btn-close" onclick="cerrarHistorial()">✕</button>
                </div>
                <div style="padding: 10px 16px; background: #e5e7eb; display: flex; justify-content: flex-end;">
                    <button class="btn-secondary" style="background: #10b981;" onclick="exportarExcel()">📊 Exportar a Excel</button>
                </div>
                <div id="historial-lista" class="historial-lista">
                    <!-- Las rutas pasadas se inyectarán aquí desde JavaScript -->
                </div>
            </div>
        </div>

        <!-- Contenedor del Mapa -->
        <div id="map-container">
            <div id="map"></div>
        </div>

        <!-- Contenedores de Inventario -->
        <div class="inventory-container">
            <h2>Inventario en Ruta</h2>

            <!-- Vallas -->
            <div class="item-card">
                <div class="item-header">
                    <span class="item-name" style="display: flex; align-items: center;">
                        <img src="valla.jpg" alt="Vallas" style="width: 40px; height: 40px; object-fit: cover; border-radius: 6px; margin-right: 12px; border: 1px solid #ddd;">
                        Vallas
                    </span>
                    <span class="item-count" id="count-vallas-enruta">0</span>
                </div>
                <div class="item-stats">
                    <span>Total Dejadas: <b id="count-vallas-dejadas">0</b></span> | 
                    <span>Total Recogidas: <b id="count-vallas-recogidas">0</b></span>
                </div>
                <div class="item-actions">
                    <button class="btn-dejar" onclick="registrarAccion('vallas', 'dejar')">Dejar (+)</button>
                    <button class="btn-recoger" onclick="registrarAccion('vallas', 'recoger')">Recoger (-)</button>
                </div>
            </div>

            <!-- Bombonas -->
            <div class="item-card">
                <div class="item-header">
                    <span class="item-name" style="display: flex; align-items: center;">
                        <img src="bombona.jpg" alt="Bombonas" style="width: 40px; height: 40px; object-fit: cover; border-radius: 6px; margin-right: 12px; border: 1px solid #ddd;">
                        Bombonas
                    </span>
                    <span class="item-count" id="count-bombonas-enruta">0</span>
                </div>
                <div class="item-stats">
                    <span>Total Dejadas: <b id="count-bombonas-dejadas">0</b></span> | 
                    <span>Total Recogidas: <b id="count-bombonas-recogidas">0</b></span>
                </div>
                <div class="item-actions">
                    <button class="btn-dejar" onclick="registrarAccion('bombonas', 'dejar')">Dejar (+)</button>
                    <button class="btn-recoger" onclick="registrarAccion('bombonas', 'recoger')">Recoger (-)</button>
                </div>
            </div>

            <!-- Maletas -->
            <div class="item-card">
                <div class="item-header">
                    <span class="item-name" style="display: flex; align-items: center;">
                        <img src="maleta.jpg" alt="Maletas" style="width: 40px; height: 40px; object-fit: cover; border-radius: 6px; margin-right: 12px; border: 1px solid #ddd;">
                        Maletas
                    </span>
                    <span class="item-count" id="count-maletas-enruta">0</span>
                </div>
                <div class="item-stats">
                    <span>Total Dejadas: <b id="count-maletas-dejadas">0</b></span> | 
                    <span>Total Recogidas: <b id="count-maletas-recogidas">0</b></span>
                </div>
                <div class="item-actions">
                    <button class="btn-dejar" onclick="registrarAccion('maletas', 'dejar')">Dejar (+)</button>
                    <button class="btn-recoger" onclick="registrarAccion('maletas', 'recoger')">Recoger (-)</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- HTML2Canvas para tomar fotos del mapa -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- App Logic -->
    <script src="app.js"></script>
</body>
</html>
